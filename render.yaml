# Render Blueprint — deploys the monorepo as two Docker web services + Postgres 17.
# Create it from https://dashboard.render.com/blueprint/new?repo=https://github.com/samrocks03/acme-salary-management
#
# Free plans: web services sleep after 15 min idle (~1 min cold start) and the free database expires after
# 30 days. Free web services can't receive private-network traffic, so the UI calls the API's public URL.
#
# CD: a push to main redeploys only the app whose folder changed (buildFilter), and only after the GitHub
# Actions checks pass (autoDeployTrigger: checksPass). The API's start script runs db:prepare, which applies
# pending migrations before Puma starts. Edits to this file are synced to Render automatically.

databases:
  - name: acme-salary-db
    databaseName: acme_salary_production
    postgresMajorVersion: "17" # db/structure.sql is dumped from Postgres 17
    plan: free
    region: singapore

services:
  - type: web
    name: acme-salary-api
    runtime: docker
    autoDeployTrigger: checksPass
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./bin/render-start # db:prepare, idempotent seed, then Puma on $PORT
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: SEED_PASSWORD # password for the seeded hr@ / viewer@ users; production refuses the public demo one
        sync: false

  - type: web
    name: acme-salary
    runtime: docker
    autoDeployTrigger: checksPass
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: API_URL # server-only; the API service's public URL (Render added the -k7nd suffix)
        value: https://acme-salary-api-k7nd.onrender.com
