---
openapi: 3.0.1
info:
  title: ACME Salary Management API
  version: v1
  description: 'HR salary management for ACME. Sign in, then click "Authorize" and
    paste the token from the `Authorization` response header (without the "Bearer
    " prefix). Contract: docs/03-api-contract.md.'
paths:
  "/api/v1/auth/sign_in":
    post:
      summary: sign in
      tags:
      - Auth
      description: Returns the JWT in the `Authorization` response header (8h expiry).
        5 failed attempts lock the account for 15 minutes; 10 requests / 3 min per
        IP + email.
      parameters: []
      responses:
        '200':
          description: signed in
          headers:
            Authorization:
              schema:
                type: string
              description: Bearer <jwt>
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/user"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '429':
          description: rate limited
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              properties:
                user:
                  type: object
                  required:
                  - email
                  - password
                  properties:
                    email:
                      type: string
                      example: hr@acme.test
                    password:
                      type: string
                      example: Password@123
  "/api/v1/auth/sign_out":
    delete:
      summary: sign out
      tags:
      - Auth
      security:
      - bearer_auth: []
      description: Revokes the token (its `jti` is denylisted); it can't be used again.
      responses:
        '200':
          description: signed out
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/employees":
    get:
      summary: list employees
      tags:
      - Employees
      security:
      - bearer_auth: []
      description: Search, filter, sort and paginate. Invalid sort/direction fall
        back to the defaults.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive contains on name, email or employee code
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: ISO-3166 alpha-2
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: job_title
        in: query
        required: false
        schema:
          type: string
      - name: employment_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - full_time
          - part_time
          - contractor
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - full_name
          - salary
          - hired_on
          - job_title
          - country_code
          - department
          - created_at
          default: full_name
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Clamped to 1..total_pages; `meta.page` is the page actually returned
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: paginated employees
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/employee"
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: create employee
      tags:
      - Employees
      security:
      - bearer_auth: []
      description: HR manager only. Also records the first salary revision (reason
        `hire`). Currency is derived from the country.
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/employee"
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '400':
          description: missing employee root
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: viewer role cannot perform this action
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - employee
              properties:
                employee:
                  "$ref": "#/components/schemas/employee_input"
  "/api/v1/employees/export":
    get:
      summary: export employees as CSV
      tags:
      - Employees
      security:
      - bearer_auth: []
      description: HR manager only. Same filters and sort as the list, unpaginated.
        Formula-like cells (= + - @ tab CR) are prefixed with a quote.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: job_title
        in: query
        required: false
        schema:
          type: string
      - name: employment_type
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: direction
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: CSV file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="employees-YYYY-MM-DD.csv"
        '401':
          description: missing or invalid token
        '403':
          description: viewer role cannot export
  "/api/v1/employees/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: show employee
      tags:
      - Employees
      security:
      - bearer_auth: []
      responses:
        '200':
          description: employee
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/employee"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: update employee
      tags:
      - Employees
      security:
      - bearer_auth: []
      description: HR manager only. `salary`, `currency` and `employee_code` are ignored;
        changing `country_code` returns 422 "can't be changed".
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/employee"
        '422':
          description: country cannot change
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: viewer role cannot perform this action
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - employee
              properties:
                employee:
                  "$ref": "#/components/schemas/employee_input"
    delete:
      summary: delete employee
      tags:
      - Employees
      security:
      - bearer_auth: []
      description: HR manager only. Deletes the employee and their salary history.
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: viewer role cannot perform this action
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/overview":
    get:
      summary: org overview (USD)
      tags:
      - Insights
      security:
      - bearer_auth: []
      responses:
        '200':
          description: overview
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - headcount
                    - countries_count
                    - total_payroll_usd
                    - avg_salary_usd
                    - median_salary_usd
                    - fx_as_of
                    properties:
                      headcount:
                        type: integer
                      countries_count:
                        type: integer
                      total_payroll_usd:
                        type: number
                      avg_salary_usd:
                        type: number
                        nullable: true
                      median_salary_usd:
                        type: number
                        nullable: true
                      fx_as_of:
                        type: string
                        format: date
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/by_country":
    get:
      summary: pay by country (local currency + USD)
      tags:
      - Insights
      security:
      - bearer_auth: []
      responses:
        '200':
          description: one row per country, headcount desc
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - country_code
                      - country_name
                      - currency
                      - headcount
                      - min_salary
                      - median_salary
                      - avg_salary
                      - max_salary
                      - avg_salary_usd
                      - median_salary_usd
                      - total_payroll_usd
                      properties:
                        country_code:
                          type: string
                        country_name:
                          type: string
                        currency:
                          type: string
                        headcount:
                          type: integer
                        min_salary:
                          type: number
                        median_salary:
                          type: number
                        avg_salary:
                          type: number
                        max_salary:
                          type: number
                        avg_salary_usd:
                          type: number
                        median_salary_usd:
                          type: number
                        total_payroll_usd:
                          type: number
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/by_job_title":
    get:
      summary: pay by job title
      tags:
      - Insights
      security:
      - bearer_auth: []
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
          enum:
          - US
          - GB
          - DE
          - NL
          - IN
          - CA
          - AU
          - SG
          - JP
          - BR
        description: Local currency for that country; omitted = USD-normalised across
          the org
      responses:
        '200':
          description: local currency within one country
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - currency
                    - rows
                    properties:
                      currency:
                        type: string
                      rows:
                        type: array
                        items:
                          type: object
                          required:
                          - job_title
                          - headcount
                          - min_salary
                          - median_salary
                          - avg_salary
                          - max_salary
                          properties:
                            job_title:
                              type: string
                            headcount:
                              type: integer
                            min_salary:
                              type: number
                            median_salary:
                              type: number
                            avg_salary:
                              type: number
                            max_salary:
                              type: number
        '422':
          description: unknown country
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/by_department":
    get:
      summary: pay by department
      tags:
      - Insights
      security:
      - bearer_auth: []
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
          enum:
          - US
          - GB
          - DE
          - NL
          - IN
          - CA
          - AU
          - SG
          - JP
          - BR
        description: Local currency for that country; omitted = USD-normalised across
          the org
      responses:
        '200':
          description: rows keyed by department
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - currency
                    - rows
                    properties:
                      currency:
                        type: string
                      rows:
                        type: array
                        items:
                          type: object
                          required:
                          - department
                          - headcount
                          - min_salary
                          - median_salary
                          - avg_salary
                          - max_salary
                          properties:
                            department:
                              type: string
                            headcount:
                              type: integer
                            min_salary:
                              type: number
                            median_salary:
                              type: number
                            avg_salary:
                              type: number
                            max_salary:
                              type: number
        '422':
          description: unknown country
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/salary_distribution":
    get:
      summary: salary histogram
      tags:
      - Insights
      security:
      - bearer_auth: []
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
          enum:
          - US
          - GB
          - DE
          - NL
          - IN
          - CA
          - AU
          - SG
          - JP
          - BR
        description: Local currency for that country; omitted = USD-normalised across
          the org
      responses:
        '200':
          description: 10 equal-width buckets between min and max
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - currency
                    - buckets
                    properties:
                      currency:
                        type: string
                      buckets:
                        type: array
                        items:
                          type: object
                          required:
                          - min
                          - max
                          - count
                          properties:
                            min:
                              type: number
                            max:
                              type: number
                            count:
                              type: integer
        '422':
          description: unknown country
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/insights/recent_changes":
    get:
      summary: recent salary changes (excludes hires)
      tags:
      - Insights
      security:
      - bearer_auth: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      responses:
        '200':
          description: custom window
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - days
                    - revisions_count
                    - employees_count
                    - avg_change_percent
                    - by_reason
                    properties:
                      days:
                        type: integer
                      revisions_count:
                        type: integer
                      employees_count:
                        type: integer
                      avg_change_percent:
                        type: number
                        nullable: true
                      by_reason:
                        type: array
                        items:
                          type: object
                          required:
                          - reason
                          - count
                          - avg_change_percent
                          properties:
                            reason:
                              type: string
                            count:
                              type: integer
                            avg_change_percent:
                              type: number
        '422':
          description: days out of range
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/lookups":
    get:
      summary: reference data for filters and forms
      tags:
      - Lookups
      security:
      - bearer_auth: []
      responses:
        '200':
          description: lookups
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - countries
                    - departments
                    - employment_types
                    - revision_reasons
                    - job_titles
                    - fx
                    properties:
                      countries:
                        type: array
                        items:
                          type: object
                          required:
                          - code
                          - name
                          - currency
                          properties:
                            code:
                              type: string
                            name:
                              type: string
                            currency:
                              type: string
                      departments:
                        type: array
                        items:
                          type: string
                      employment_types:
                        type: array
                        items:
                          type: string
                      revision_reasons:
                        type: array
                        items:
                          type: string
                      job_titles:
                        type: array
                        items:
                          type: string
                      fx:
                        type: object
                        required:
                        - base
                        - as_of
                        - rates
                        properties:
                          base:
                            type: string
                          as_of:
                            type: string
                            format: date
                          rates:
                            type: object
                            additionalProperties:
                              type: number
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/me":
    get:
      summary: current user
      tags:
      - Auth
      security:
      - bearer_auth: []
      responses:
        '200':
          description: the signed-in user
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/user"
        '401':
          description: expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/employees/{employee_id}/salary_revisions":
    parameters:
    - name: employee_id
      in: path
      schema:
        type: integer
      required: true
    get:
      summary: salary history
      tags:
      - Salary revisions
      security:
      - bearer_auth: []
      description: Immutable history, newest first.
      responses:
        '200':
          description: revisions, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/salary_revision"
        '404':
          description: employee not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: record a salary change
      tags:
      - Salary revisions
      security:
      - bearer_auth: []
      description: HR manager only. Becomes the employee's current salary. `effective_on`
        must be <= today, >= hired_on and >= the latest revision; `hire` is system-only.
      parameters: []
      responses:
        '201':
          description: recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    "$ref": "#/components/schemas/salary_revision"
        '422':
          description: breaks a revision rule
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: employee not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: viewer role cannot perform this action
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - salary_revision
              properties:
                salary_revision:
                  "$ref": "#/components/schemas/salary_revision_input"
servers:
- url: http://localhost:3001
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error:
      type: object
      required:
      - success
      - errors
      properties:
        success:
          type: boolean
          enum:
          - false
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    user:
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
